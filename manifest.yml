modules:
  jiraServiceManagement:queuePage:
    - key: golden-set-queue-page
      resource: main
      resolver:
        function: resolver
      title: Golden Set
  confluence:contentBylineItem:
    - key: golden-set-byline
      title: Golden Set
      tooltip: Golden answers that rely on this article
      resource: main
      resolver:
        function: resolver
      viewportSize: large
      contentPropertyKey: golden-set-byline-6f1c2a
  scheduledTrigger:
    - key: check-article-edits
      function: check-all
      interval: fiveMinute
  function:
    - key: resolver
      handler: index.handler
    - key: check-all
      handler: scheduled.scheduledCheck
      timeoutSeconds: 300
resources:
  - key: main
    path: static/ui/dist
permissions:
  scopes:
    - read:servicedesk-request
    - write:servicedesk-request
    - manage:servicedesk-customer
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:confluence-content.summary
    - read:page:confluence
    - write:page:confluence
    - read:space:confluence
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/c4b582c2-566a-4180-9837-2917cd0f3d87
